<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaveVault — Личный кабинет пользователя</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f6ff', 100: '#e0edff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
            accent: { emerald: '#10b981', purple: '#a855f7' },
            dark: { bg: '#090d16', card: '#111827', border: '#1f2937', input: '#1f2937' }
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

  <!-- HEADER -->
  <header class="border-b border-dark-border bg-dark-card/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-accent-purple flex items-center justify-center shadow-lg shadow-brand-500/20">
          <i class="fa-solid fa-user text-xl text-white"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight text-white">Кабинет Пользователя</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-brand-500/10 text-brand-500 border border-brand-500/20 font-mono ml-2">User Mode</span>
        </div>
      </a>

      <div class="flex items-center space-x-4">
        <a href="index.html" class="text-xs text-gray-400 hover:text-white flex items-center space-x-1">
          <i class="fa-solid fa-arrow-left"></i><span>На главную</span>
        </a>
        <button onclick="handleLogout()" class="text-xs px-3 py-1.5 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-lg hover:bg-rose-500/20">Выйти</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-8">
    
    <!-- CREATE FORM WITH PRESET TAGS & AUTO DATE -->
    <div class="bg-dark-card border border-dark-border p-6 rounded-2xl space-y-4">
      <h3 class="font-bold text-white text-lg flex items-center space-x-2">
        <i class="fa-solid fa-pen-to-square text-brand-500"></i>
        <span>Создать запись / Загрузить блокнот или ссылку</span>
      </h3>
      
      <form onsubmit="handleUserCreate(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Название заметки</label>
          <input type="text" id="usr-title" required placeholder="Введите название..." class="w-full px-4 py-2.5 bg-dark-input border border-dark-border rounded-xl text-white text-sm outline-none focus:border-brand-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Описание заметки</label>
          <input type="text" id="usr-desc" placeholder="Краткое описание (необязательно)..." class="w-full px-4 py-2.5 bg-dark-input border border-dark-border rounded-xl text-white text-sm outline-none focus:border-brand-500">
        </div>

        <!-- TAGS SELECTION & CUSTOM TAG INPUT -->
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Выберите теги или введите свой (можно пропустить):</label>
          <div id="usr-tag-selector" class="flex flex-wrap gap-2 mb-2"></div>
          <input type="text" id="usr-custom-tag" placeholder="Свой тег (например: #МойПресет) или оставьте пустым..." class="w-full px-4 py-2 bg-dark-input border border-dark-border rounded-xl text-white text-xs outline-none focus:border-brand-500">
        </div>

        <!-- SOURCE MODE -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="sm:col-span-1">
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Способ добавления</label>
            <select id="usr-mode" onchange="toggleUserMode()" class="w-full px-4 py-2.5 bg-dark-input border border-dark-border rounded-xl text-white text-sm outline-none">
              <option value="text">Текст блокнота / Код вручную</option>
              <option value="file">Загрузить файл блокнота с ПК</option>
              <option value="github">Ссылка из GitHub (Raw / Link)</option>
            </select>
          </div>
          <div class="sm:col-span-2 flex items-end">
            <div class="text-xs text-gray-400 italic">
              <i class="fa-regular fa-clock mr-1"></i>Дата создания: <span id="auto-date-badge" class="font-mono text-brand-400">Автоматически</span>
            </div>
          </div>
        </div>

        <!-- INPUT BOXES -->
        <div id="usr-box-text">
          <textarea id="usr-text-content" rows="5" placeholder="Вставьте сюда текст блокнота, конфиг или код..." class="w-full px-4 py-2.5 bg-dark-input border border-dark-border rounded-xl text-white font-mono text-xs outline-none focus:border-brand-500"></textarea>
        </div>

        <div id="usr-box-file" class="hidden">
          <input type="file" id="usr-file-input" accept=".txt,.json,.conf,.sh,.ini,.log" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-600 file:text-white cursor-pointer">
        </div>

        <div id="usr-box-github" class="hidden">
          <input type="url" id="usr-github-url" placeholder="https://raw.githubusercontent.com/... или https://github.com/..." class="w-full px-4 py-2.5 bg-dark-input border border-dark-border rounded-xl text-white text-sm outline-none focus:border-accent-emerald">
        </div>

        <button type="submit" class="px-6 py-3 bg-brand-600 hover:bg-brand-500 font-bold text-white text-sm rounded-xl transition-all shadow-lg shadow-brand-600/30">
          Сохранить заметку
        </button>
      </form>
    </div>

    <!-- MY ITEMS -->
    <div class="bg-dark-card border border-dark-border p-6 rounded-2xl">
      <h3 class="font-bold text-white mb-4">Ваши сохраненные заметки</h3>
      <div id="user-items-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
