<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaveVault — Панель Администратора</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f6ff', 100: '#e0edff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
            accent: { emerald: '#10b981', purple: '#a855f7' },
            dark: { bg: '#090d16', card: '#111827', border: '#1f2937', input: '#1f2937' }
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

  <!-- HEADER -->
  <header class="border-b border-dark-border bg-dark-card/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-rose-600 flex items-center justify-center shadow-lg shadow-purple-500/20">
          <i class="fa-solid fa-user-shield text-xl text-white"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight text-white">Панель Администратора</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-400 border border-purple-500/30 font-mono ml-2">Root</span>
        </div>
      </a>

      <div class="flex items-center space-x-4">
        <a href="index.html" class="text-xs text-gray-400 hover:text-white flex items-center space-x-1">
          <i class="fa-solid fa-arrow-left"></i><span>На главную</span>
        </a>
        <button onclick="handleLogout()" class="text-xs px-3 py-1.5 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-lg hover:bg-rose-500/20">Выйти</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-8">
    
    <!-- STATS -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-dark-card border border-dark-border p-5 rounded-2xl">
        <div class="text-xs text-gray-400 font-mono">Всего элементов</div>
        <div id="stat-items-count" class="text-2xl font-bold text-white mt-1">0</div>
      </div>
      <div class="bg-dark-card border border-dark-border p-5 rounded-2xl">
        <div class="text-xs text-gray-400 font-mono">Пользователей</div>
        <div id="stat-users-count" class="text-2xl font-bold text-purple-400 mt-1">0</div>
      </div>
      <div class="bg-dark-card border border-dark-border p-5 rounded-2xl">
        <div class="text-xs text-gray-400 font-mono">Система тегов</div>
        <div id="stat-tags-count" class="text-2xl font-bold text-accent-emerald mt-1">0</div>
      </div>
    </div>

    <!-- PRESET TAGS MANAGEMENT -->
    <div class="bg-dark-card border border-dark-border p-6 rounded-2xl space-y-4">
      <h3 class="font-bold text-white flex items-center space-x-2">
        <i class="fa-solid fa-tags text-accent-emerald"></i>
        <span>Управление системными тегами</span>
      </h3>
      <div id="admin-tags-list" class="flex flex-wrap gap-2"></div>
      
      <form onsubmit="handleAdminAddTag(event)" class="flex gap-2 max-w-md pt-2">
        <input type="text" id="adm-new-tag" required placeholder="Новый тег (напр: #Docker)..." class="flex-1 px-4 py-2 bg-dark-input border border-dark-border rounded-xl text-white text-sm outline-none">
        <button type="submit" class="px-4 py-2 bg-accent-emerald hover:opacity-90 font-bold text-white text-xs rounded-xl">Добавить тег</button>
      </form>
    </div>

    <!-- USERS TABLE -->
    <div class="bg-dark-card border border-dark-border p-6 rounded-2xl space-y-4">
      <h3 class="font-bold text-white flex items-center space-x-2">
        <i class="fa-solid fa-users text-purple-400"></i>
        <span>Управление пользователями</span>
      </h3>
      <div class="overflow-x-auto border border-dark-border rounded-xl">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="bg-dark-bg text-xs uppercase text-gray-400 font-mono">
            <tr>
              <th class="p-3">Логин</th>
              <th class="p-3">Роль</th>
              <th class="p-3 text-right">Действия</th>
            </tr>
          </thead>
          <tbody id="admin-users-table" class="divide-y divide-dark-border"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
